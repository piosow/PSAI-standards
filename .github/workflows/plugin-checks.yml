name: Plugin checks

# Testy hooków i synchronizacja pluginu Antigravity z pluginem Claude Code.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Hook tests and Antigravity sync check
        run: sh tests/run.sh
      - name: Git hooks identical to templates
        run: diff -r .githooks plugins/psai-standards/templates/githooks
